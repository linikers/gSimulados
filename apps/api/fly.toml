app = "gsimulados-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Mantém 1 máquina quente: com min_machines_running = 0 toda primeira
  # requisição pagava cold start e podia retornar 502.
  min_machines_running = 1
  processes = ["app"]

# Health check: só recebe tráfego quando /health responde 200.
[[http_service.checks]]
  interval = "15s"
  timeout = "10s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
