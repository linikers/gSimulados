name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      # --ignore-scripts: evita a compilacao nativa do `canvas`
      # (nao e necessaria para build/testes).
      - name: Instalar dependencias
        run: yarn install --ignore-scripts --frozen-lockfile

      # A api importa @gsimulados/shared, cujo main/types apontam para dist/.
      # Sem este build, o tsc da api falha.
      - name: Build @gsimulados/shared
        run: yarn workspace @gsimulados/shared build

      - name: Build API (tsc)
        run: yarn workspace @gsimulados/api build

      - name: Build Web
        run: yarn workspace @gsimulados/web build

      - name: Testes da API (jest)
        run: yarn workspace @gsimulados/api test

      - name: Lint da Web
        run: yarn workspace @gsimulados/web lint
